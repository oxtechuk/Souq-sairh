<!-- Articles Featured Component -->
<section class="articles-featured-section" dir="rtl">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Section Header -->
    <div class="text-center mb-12">
      <h2 class="text-[32px] font-extrabold mb-3">
        <span class="text-primary">مقالاتنا</span>
        <span class="text-gold"> المميزة</span>
      </h2>
      <p class="text-[15px]" style="color: #1A3263;">اطلع على أفضل المقالات لدينا</p>
    </div>

    <!-- Cards Grid -->
    <div class="articles-grid" id="articles-featured-grid">
      <!-- Cards injected by JS -->
    </div>

  </div>
</section>

<script>
  (function () {
    const grid = document.getElementById('articles-featured-grid');
    if (grid && window.articlesData && window.generateArticleCard) {
      grid.innerHTML = window.articlesData.slice(0, 3).map(window.generateArticleCard).join('');
    }
  })();
</script>
