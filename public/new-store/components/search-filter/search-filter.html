<!-- Search Filter Component -->
<section class="bg-white py-8 sm:py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="space-y-6">
      <!-- Filter Dropdowns Row -->
      <div
        class="grid grid-cols-2 lg:grid-cols-4 gap-4"
        dir="rtl"
      >
        <!-- Commercial Brand -->
        <div class="relative">
          <label
            class="block text-sm font-semibold text-gray-700 mb-2 text-right"
          >
            العلامة التجارية
          </label>
          <select
            class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-500 bg-white appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-right"
          >
            <option value="">جميع العلامات</option>
            <option value="toyota">تويوتا</option>
            <option value="honda">هوندا</option>
            <option value="nissan">نيسان</option>
            <option value="hyundai">هيونداي</option>
          </select>
          <i
            class="fas fa-chevron-down absolute left-4 top-[52px] text-gray-400 pointer-events-none"
          ></i>
        </div>

        <!-- Car Type -->
        <div class="relative">
          <label
            class="block text-sm font-semibold text-gray-700 mb-2 text-right"
          >
            نوع السيارة
          </label>
          <select
            class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-500 bg-white appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-right"
          >
            <option value="">جميع الأنواع</option>
            <option value="sedan">سيدان</option>
            <option value="suv">SUV</option>
            <option value="hatchback">هاتشباك</option>
            <option value="pickup">بيك أب</option>
          </select>
          <i
            class="fas fa-chevron-down absolute left-4 top-[52px] text-gray-400 pointer-events-none"
          ></i>
        </div>

        <!-- Car Category -->
        <div class="relative">
          <label
            class="block text-sm font-semibold text-gray-700 mb-2 text-right"
          >
            فئة السيارة
          </label>
          <select
            class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-500 bg-white appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-right"
          >
            <option value="">جميع الفئات</option>
            <option value="economy">اقتصادية</option>
            <option value="luxury">فاخرة</option>
            <option value="sport">رياضية</option>
            <option value="family">عائلية</option>
          </select>
          <i
            class="fas fa-chevron-down absolute left-4 top-[52px] text-gray-400 pointer-events-none"
          ></i>
        </div>

        <!-- Manufacturing Year -->
        <div class="relative">
          <label
            class="block text-sm font-semibold text-gray-700 mb-2 text-right"
          >
            سنة الصنع
          </label>
          <select
            class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-500 bg-white appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-right"
          >
            <option value="">جميع الموديلات</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
          </select>
          <i
            class="fas fa-chevron-down absolute left-4 top-[52px] text-gray-400 pointer-events-none"
          ></i>
        </div>
      </div>

      <!-- Search Bar Row -->
      <div class="flex flex-col sm:flex-row gap-4" dir="rtl">
        <!-- Search Input -->
        <div class="flex-1">
          <input
            type="text"
            placeholder="ابحث عن سيارة بالاسم، العلامة التجارية، الموديل، أو المواصفات..."
            class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-right"
          />
        </div>

        <!-- Search Button -->
        <button
          class="bg-primary hover:bg-primary-dark text-white px-8 py-3 rounded-lg transition-all hover:-translate-y-1 flex items-center justify-center gap-2 whitespace-nowrap"
        >
          <i class="fas fa-search"></i>
          <span>عرض النتائج</span>
        </button>

        <!-- Reset Button -->
        <button
          class="bg-white text-gray-700 border-2 border-gray-300 hover:border-primary hover:text-primary px-8 py-3 rounded-lg transition-all whitespace-nowrap"
        >
          إعادة تعيين
        </button>
      </div>
    </div>
  </div>
</section>
