<!-- Offers Grid Component -->
<section class="bg-white py-12" dir="rtl">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section Header -->
    <div class="flex items-start justify-between mb-8">
      <div class="flex-1">
        <h2 class="text-[32px] font-extrabold mb-3 text-center">
          <span class="text-primary text-shadow-md">عروض</span>
        </h2>
      </div>
    </div>

    <!-- Offers Grid -->
    <div class="offers-grid">
      <!-- Row 1: 3 cards (left tall, center short + logo, right tall) -->
      <div class="offers-row-1">
        <!-- Card 1 - Tall Left -->
        <div class="offer-card offer-tall">
          <img src="assets/images/offers/offer-1.svg" alt="عرض 1" />
          <div class="offer-overlay"></div>
          <div class="offer-content">
            <div class="offer-arrow">
              <i class="fas fa-arrow-left"></i>
            </div>
          </div>
        </div>

        <!-- Card 2 - Short Center + Logo Below -->
        <div class="offer-column-center">
          <div class="offer-card offer-short">
            <img src="assets/images/offers/offer-2.svg" alt="عرض 2" />
            <div class="offer-overlay"></div>
            <div class="offer-content">
              <div class="offer-arrow">
                <i class="fas fa-arrow-left"></i>
              </div>
            </div>
          </div>

          <!-- Logo Card -->
          <div class="offer-card offer-logo-card">
            <img src="assets/images/Logo.svg" alt="Logo" class="logo-only" />
          </div>
        </div>

        <!-- Card 3 - Tall Right -->
        <div class="offer-card offer-tall">
          <img src="assets/images/offers/offer-3.svg" alt="عرض 3" />
          <div class="offer-overlay"></div>
          <div class="offer-content">
            <div class="offer-arrow">
              <i class="fas fa-arrow-left"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Row 2: 2 equal cards -->
      <div class="offers-row-2">
        <!-- Card 4 -->
        <div class="offer-card offer-wide">
          <img src="assets/images/offers/offer-4.svg" alt="عرض 4" />
          <div class="offer-overlay"></div>
          <div class="offer-content">
            <div class="offer-arrow">
              <i class="fas fa-arrow-left"></i>
            </div>
          </div>
        </div>

        <!-- Card 5 -->
        <div class="offer-card offer-wide">
          <img src="assets/images/offers/offer-5.svg" alt="عرض 5" />
          <div class="offer-overlay"></div>
          <div class="offer-content">
            <div class="offer-arrow">
              <i class="fas fa-arrow-left"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
