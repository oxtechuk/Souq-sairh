<!-- Testimonials Component -->
<section class="py-16" dir="rtl">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section Header -->
    <div class="text-center mb-12">
      <h2 class="text-[36px] font-extrabold mb-4">
        <span class="text-primary">تجارب</span>
        <span class="text-gold"> نفخر بها</span>
      </h2>
      <p class="text-gray-600 text-[16px] leading-relaxed max-w-3xl mx-auto">
        لأن رضاكم مع غايتنا، نشارككم آراء نخبة من عملائنا حول خدماتنا وحلولنا التمويلية
      </p>
    </div>

    <!-- Carousel -->
    <div class="testimonials-carousel-wrapper">
      <div class="testimonials-viewport">
        <div class="testimonials-track" id="testimonials-track"></div>
      </div>

      <!-- Controls -->
      <div class="flex items-center justify-center gap-8 mt-10">
        <button class="testimonials-prev w-[48px] h-[48px] bg-primary hover:bg-primary-dark text-white rounded-full flex items-center justify-center transition-all">
          <i class="fas fa-arrow-right text-lg"></i>
        </button>
        <div class="testimonials-dots flex gap-2" id="testimonials-dots"></div>
        <button class="testimonials-next w-[48px] h-[48px] bg-primary hover:bg-primary-dark text-white rounded-full flex items-center justify-center transition-all">
          <i class="fas fa-arrow-left text-lg"></i>
        </button>
      </div>
    </div>
  </div>
</section>

<script>
  setTimeout(function() {
    var data = window.testimonialsData;
    var genHTML = window.generateTestimonialCardHTML;
    if (!data || !genHTML) return;

    var track = document.getElementById('testimonials-track');
    var dotsContainer = document.getElementById('testimonials-dots');
    var prevBtn = document.querySelector('.testimonials-prev');
    var nextBtn = document.querySelector('.testimonials-next');
    if (!track) return;

    var isMobile = window.innerWidth < 1024;
    var perPage = isMobile ? 1 : 3;
    var totalPages = Math.ceil(data.length / perPage);
    var pageIndex = 0;

    // Build pages (doubled for loop)
    function buildPages(items) {
      var html = '';
      var pages = Math.ceil(items.length / perPage);
      for (var i = 0; i < pages; i++) {
        html += '<div class="testimonials-page">';
        items.slice(i * perPage, i * perPage + perPage).forEach(function(t) {
          html += genHTML(t);
        });
        html += '</div>';
      }
      return html;
    }

    track.innerHTML = buildPages(data) + buildPages(data);
    track.style.transform = 'translateX(0)';
    track.style.transition = 'none';

    // Build dots
    dotsContainer.innerHTML = '';
    for (var d = 0; d < totalPages; d++) {
      var dot = document.createElement('span');
      dot.className = 'testimonials-dot' + (d === 0 ? ' active' : '');
      dotsContainer.appendChild(dot);
    }

    function syncDots() {
      var dots = dotsContainer.querySelectorAll('.testimonials-dot');
      dots.forEach(function(dot, i) {
        dot.classList.toggle('active', i === (pageIndex % totalPages));
      });
    }

    function goTo(index) {
      pageIndex = index;
      track.style.transition = 'transform 0.5s ease-in-out';
      track.style.transform = 'translateX(' + (pageIndex * 100) + '%)';
      syncDots();
      if (pageIndex >= totalPages) {
        setTimeout(function() {
          track.style.transition = 'none';
          track.style.transform = 'translateX(0)';
          pageIndex = 0;
        }, 500);
      }
    }

    prevBtn.onclick = function() { goTo(pageIndex <= 0 ? totalPages - 1 : pageIndex - 1); };
    nextBtn.onclick = function() { goTo(pageIndex + 1); };
    setInterval(function() { goTo(pageIndex + 1); }, 3500);
    syncDots();
  }, 200);
</script>
